  <g id="crease" fill="none" stroke="#0070c0" stroke-width="0.4" stroke-dasharray="4 2"><polyline points="130,125 370,125 370,285 130,285 130,125"/><line x1="370" y1="125" x2="430" y2="125"/><line x1="370" y1="285" x2="430" y2="285"/><line x1="70" y1="125" x2="130" y2="125"/><line x1="70" y1="285" x2="130" y2="285"/><polyline points="540,123 784,123 784,287 540,287 540,123"/><line x1="784" y1="123" x2="824" y2="123"/><line x1="784" y1="287" x2="824" y2="287"/><line x1="500" y1="123" x2="540" y2="123"/><line x1="500" y1="287" x2="540" y2="287"/></g>
  <g id="cut" fill="none" stroke="#e4002b" stroke-width="0.5" stroke-linejoin="round"><polygon id="base-cut" points="130,65 370,65 370,125 372,100 422,100 430,117 430,293 422,310 372,310 370,285 370,345 130,345 130,285 128,310 78,310 70,293 70,117 78,100 128,100 130,125"/><polygon id="lid-cut" points="540,83 784,83 784,123 786,98 818,98 824,117 824,293 818,312 786,312 784,287 784,327 540,327 540,287 538,312 506,312 500,293 500,117 506,98 538,98 540,123"/></g>
  <g id="dimensions" fill="#555" stroke="#888" stroke-width="0.25" font-family="Helvetica, Arial, sans-serif" font-size="6"><line x1="130" y1="358" x2="370" y2="358"/><line x1="130" y1="355.5" x2="130" y2="360.5"/><line x1="370" y1="355.5" x2="370" y2="360.5"/><text x="250" y="356" text-anchor="middle">240</text><line x1="57" y1="125" x2="57" y2="285"/><line x1="54.5" y1="125" x2="59.5" y2="125"/><line x1="54.5" y1="285" x2="59.5" y2="285"/><text transform="translate(55 205) rotate(-90)" text-anchor="middle">160</text><line x1="443" y1="285" x2="443" y2="345"/><line x1="440.5" y1="285" x2="445.5" y2="285"/><line x1="440.5" y1="345" x2="445.5" y2="345"/><text transform="translate(441 315) rotate(-90)" text-anchor="middle">60</text><line x1="70" y1="52" x2="430" y2="52"/><line x1="70" y1="49.5" x2="70" y2="54.5"/><line x1="430" y1="49.5" x2="430" y2="54.5"/><text x="250" y="50" text-anchor="middle">360</text><line x1="540" y1="340" x2="784" y2="340"/><line x1="540" y1="337.5" x2="540" y2="342.5"/><line x1="784" y1="337.5" x2="784" y2="342.5"/><text x="662" y="338" text-anchor="middle">244</text><line x1="487" y1="123" x2="487" y2="287"/><line x1="484.5" y1="123" x2="489.5" y2="123"/><line x1="484.5" y1="287" x2="489.5" y2="287"/><text transform="translate(485 205) rotate(-90)" text-anchor="middle">164</text><line x1="837" y1="287" x2="837" y2="327"/><line x1="834.5" y1="287" x2="839.5" y2="287"/><line x1="834.5" y1="327" x2="839.5" y2="327"/><text transform="translate(835 307) rotate(-90)" text-anchor="middle">40</text><line x1="500" y1="70" x2="824" y2="70"/><line x1="500" y1="67.5" x2="500" y2="72.5"/><line x1="824" y1="67.5" x2="824" y2="72.5"/><text x="662" y="68" text-anchor="middle">324</text></g>
  <g id="labels" font-family="Helvetica, Arial, sans-serif" fill="#222" stroke="none"><text x="250" y="203" text-anchor="middle" font-size="9" font-weight="700">BASE</text><text x="250" y="213" text-anchor="middle" font-size="6">inner 240 x 160 x 60</text><text x="250" y="97" text-anchor="middle" font-size="6">LONG WALL 240 x 60</text><text x="250" y="317" text-anchor="middle" font-size="6">LONG WALL 240 x 60</text><text transform="translate(102 205) rotate(-90)" text-anchor="middle" font-size="6">SHORT WALL 160 x 60</text><text transform="translate(402 205) rotate(90)" text-anchor="middle" font-size="6">SHORT WALL 160 x 60</text><text x="398" y="114.5" text-anchor="middle" font-size="5" fill="#555">GLUE</text><text x="398" y="299.5" text-anchor="middle" font-size="5" fill="#555">GLUE</text><text x="102" y="114.5" text-anchor="middle" font-size="5" fill="#555">GLUE</text><text x="102" y="299.5" text-anchor="middle" font-size="5" fill="#555">GLUE</text><text x="662" y="203" text-anchor="middle" font-size="9" font-weight="700">LID</text><text x="662" y="213" text-anchor="middle" font-size="6">inner 244 x 164 x 40</text><text x="662" y="105" text-anchor="middle" font-size="6">LONG WALL 244 x 40</text><text x="662" y="309" text-anchor="middle" font-size="6">LONG WALL 244 x 40</text><text transform="translate(522 205) rotate(-90)" text-anchor="middle" font-size="6">SHORT WALL 164 x 40</text><text transform="translate(806 205) rotate(90)" text-anchor="middle" font-size="6">SHORT WALL 164 x 40</text><text x="802" y="112.5" text-anchor="middle" font-size="5" fill="#555">GLUE</text><text x="802" y="301.5" text-anchor="middle" font-size="5" fill="#555">GLUE</text><text x="522" y="112.5" text-anchor="middle" font-size="5" fill="#555">GLUE</text><text x="522" y="301.5" text-anchor="middle" font-size="5" fill="#555">GLUE</text></g>
  
<g id="legend" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#222">
  <rect x="40" y="375" width="804" height="88" fill="#fff" stroke="#999" stroke-width="0.3"/>
  <text x="48" y="385" font-size="8" font-weight="700">LEGEND</text>
  <line x1="48" y1="397" x2="78" y2="397" stroke="#e4002b" stroke-width="0.5"/>
  <text x="84" y="399">CUT LINE (die knife, solid red)</text>
  <line x1="48" y1="409" x2="78" y2="409" stroke="#0070c0" stroke-width="0.5" stroke-dasharray="4 2"/>
  <text x="84" y="411">CREASE / FOLD LINE (dashed blue)</text>
  <line x1="48" y1="421" x2="78" y2="421" stroke="#00a651" stroke-width="0.5"/>
  <text x="84" y="423">BLEED, 3 mm outside cut (green)</text>
  <line x1="48" y1="433" x2="78" y2="433" stroke="#f28c00" stroke-width="0.4"/>
  <text x="84" y="435">SAFE AREA, 3 mm inside panel edge (orange): keep text/logos inside</text>
  <line x1="48" y1="445" x2="78" y2="445" stroke="#888" stroke-width="0.25" stroke-dasharray="1 2"/>
  <text x="84" y="447">CENTRE LINES and DIMENSIONS in mm (grey)</text>
  <rect x="48" y="451" width="30" height="8" fill="url(#glue)" stroke="#777" stroke-width="0.3"/>
  <text x="84" y="457">GLUE TAB: apply glue, fold 90 deg, bond to inside of long wall</text>
  <g transform="translate(462.0 0)">
    <text x="0" y="385" font-size="8" font-weight="700">SPEC</text>
    <text x="0" y="399">Structure: two-piece telescoping box, tray style (base + lid), 1 sheet each</text>
    <text x="0" y="411">Base inner: 240 x 160 x 60 mm. Lid inner: 244 x 164 x 40 mm</text>
    <text x="0" y="423">Board: 1.5 mm kraft; lid clearance 1 mm per side beyond base outer (243 x 163)</text>
    <text x="0" y="435">Grain: parallel to long side. Corner glue tabs 25 mm, chamfered, 2 mm relief slit</text>
    <text x="0" y="447">Units: mm. Fold allowance for board thickness not applied: verify on sample</text>
  </g>
</g>
</svg>
