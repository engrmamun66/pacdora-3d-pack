  <rect id="sheet" width="884" height="480" fill="#ffffff"/>
  <text x="40" y="26" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#222">COOKIE BOX: TWO-PIECE DIELINE (FLAT)</text>
  <text x="40" y="36" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#555">Base and lid side by side. Scale 1:1, units mm.</text>

  <g id="fills"><g id="base-panels" fill="#ead9bd" stroke="none"><polygon points="130,65 370,65 370,125 372,100 422,100 430,117 430,293 422,310 372,310 370,285 370,345 130,345 130,285 128,310 78,310 70,293 70,117 78,100 128,100 130,125"/></g><g id="base-glue-tabs" fill="url(#glue)" stroke="none"><polygon points="370,125 372,100 422,100 430,117 430,125"/><polygon points="370,285 372,310 422,310 430,293 430,285"/><polygon points="130,285 128,310 78,310 70,293 70,285"/><polygon points="130,125 128,100 78,100 70,117 70,125"/></g><g id="lid-panels" fill="#ead9bd" stroke="none"><polygon points="540,83 784,83 784,123 786,98 818,98 824,117 824,293 818,312 786,312 784,287 784,327 540,327 540,287 538,312 506,312 500,293 500,117 506,98 538,98 540,123"/></g><g id="lid-glue-tabs" fill="url(#glue)" stroke="none"><polygon points="784,123 786,98 818,98 824,117 824,123"/><polygon points="784,287 786,312 818,312 824,293 824,287"/><polygon points="540,287 538,312 506,312 500,293 500,287"/><polygon points="540,123 538,98 506,98 500,117 500,123"/></g></g>
