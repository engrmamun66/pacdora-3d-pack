# Production stack: web + Postgres. Secrets come from infra/.env.prod (never committed).
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
name: dieline-prod
services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: packaging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env.prod}
      POSTGRES_DB: packaging
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packaging -d packaging"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published: only the web container can reach the database.

  web:
    build:
      context: ..
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?set the public Turnstile site key}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://packaging:${POSTGRES_PASSWORD}@db:5432/packaging
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?https://your.domain}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:?}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-20}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-forwarded-for}
    volumes:
      - uploads:/data/storage
    ports:
      # Bind to localhost: put a TLS reverse proxy (Caddy/nginx) in front.
      - "127.0.0.1:3100:3100"

volumes:
  dbdata:
  uploads:
