<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dieline Capture</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f7; --panel: #fff; --line: #d4d4d8; --text: #18181b; --muted: #71717a; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18181b; --panel: #27272a; --line: #3f3f46; --text: #f4f4f5; --muted: #a1a1aa; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 15px; margin: 0 8px 0 0; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px 6px; margin: 0; display: flex; gap: 10px; align-items: center; }
  legend { font-size: 12px; color: var(--muted); padding: 0 4px; }
  label { display: inline-flex; align-items: center; gap: 5px; }
  input[type=number] { width: 80px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: inherit; }
  input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
  button { padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: inherit; cursor: pointer; font: inherit; }
  button.primary { background: #18181b; color: #fff; border-color: #18181b; }
  button[aria-pressed=true] { outline: 2px solid var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-width: 0; }
  h2 { font-size: 12px; font-weight: 600; margin: 0 0 6px; color: var(--muted); }
  #pic { position: relative; line-height: 0; }
  #pic canvas { width: 100%; height: auto; display: block; cursor: crosshair; background: #fff; }
  #out { background: #fff; line-height: 0; overflow: auto; }
  #out svg { width: 100%; height: auto; display: block; }
  #msg { padding: 6px 16px; font-size: 13px; color: var(--muted); }
  #msg.err { color: #dc2626; }
</style>
</head>
<body>
<header>
  <h1>Dieline Capture</h1>
  <fieldset><legend>Scale</legend>
    <button id="mode-scale" type="button" aria-pressed="false" title="Click two ends of a line whose length you know">Measure</button>
    <label>= <input id="mm" type="number" min="0.1" step="0.1" value="100"> mm</label>
    <span id="scale-info" style="color:var(--muted)"></span>
  </fieldset>
  <fieldset><legend>Line colours (click Pick, then a line in the picture)</legend>
    <label><input id="c-cut" type="color"> Cut <button type="button" data-pick="cut" aria-pressed="false">Pick</button></label>
    <label><input id="c-crease" type="color"> Crease <button type="button" data-pick="crease" aria-pressed="false">Pick</button></label>
    <label><input id="c-bleed" type="color"> Bleed <button type="button" data-pick="bleed" aria-pressed="false">Pick</button></label>
    <label>Tolerance <input id="tol" type="range" min="20" max="200" value="85"></label>
  </fieldset>
  <fieldset><legend>Leave out</legend>
    <button id="mode-erase" type="button" aria-pressed="false" title="Drag a rectangle round anything that is not part of the dieline (size arrows, notes)">Ignore area</button>
    <button id="erase-clear" type="button" disabled>Clear</button>
  </fieldset>
  <fieldset><legend>Check</legend>
    <label><input id="overlay" type="checkbox" checked> Show lines on the picture</label>
    <button id="save-pic" type="button" title="Save the picture as a PNG, to look at it or to send it for tuning">Save picture</button>
  </fieldset>
  <span style="flex:1"></span>
  <button id="copy" type="button" disabled>Copy SVG</button>
  <button id="save" type="button" class="primary" disabled>Download SVG</button>
</header>
<div id="msg">Loading the picture…</div>
<main>
  <section><h2>Your picture</h2><div id="pic"><canvas id="canvas"></canvas></div></section>
  <section><h2>SVG <span id="size"></span></h2><div id="out"></div></section>
</main>
<script type="module" src="result.js"></script>
</body>
</html>
